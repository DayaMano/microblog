spring:
    application:
        name: user-service
    datasource:
        url: jdbc:postgresql://localhost:5432/microblog_users
        username: microblog
        password: microblog
    jpa:
        hibernate:
            ddl-auto: validate

server:
    port: 8081

management:
    endpoints:
        web:
            exposure:
                include: health, info
    endpoint:
        health:
            show-details: always

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: user-service
                          uri: http://localhost:8081
                          predicates:
                            - Path=/api/users/**
    security:
        oauth2:
            client:
                registration:
                    keycloak:
                        client-id: microblog-web
                        scope: openid, profile, email
                        authorization-grant-type: authorization_code
                provider:
                    keycloak:
                        issuer-uri: http://localhost:8085/realms/microblog
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8085/realms/microblog

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health, info
